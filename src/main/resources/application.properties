spring.application.name=autonexo-backend

spring.profiles.active=dev

# Spring DataSource Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/swiftport-database?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Admin-123
# Spring Data JPA Configuration
spring.jpa.show-sql=true
#Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.atg.autonexo.backend.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Application Information for Documentation
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# JWT Configuration Properties
authorization.jwt.secret=autonexo-super-secret-jwt-key-for-token-signing-credentials-2025
authorization.jwt.expiration.days=7

# Flyway Configuration
spring.flyway.enabled=true

