# =========================================
# PRODUCTION ENVIRONMENT CONFIGURATION
# =========================================

# =========================================
# DATABASE CONFIGURATION
# =========================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================
# HIKARI CONNECTION POOL
# =========================================
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.initialization-fail-timeout=60000

# =========================================
# JPA / HIBERNATE
# =========================================
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# REMOVE OLD DEPRECATED MYSQL8DIALECT
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# =========================================
# JWT CONFIGURATION
# =========================================
authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.expiration.days=${JWT_EXPIRATION_DAYS:7}

# =========================================
# FLYWAY
# =========================================
spring.flyway.enabled=${FLYWAY_ENABLED:false}

# =========================================
# CLOUDINARY
# =========================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.base-url=${CLOUDINARY_BASE_URL:autonexo}

# =========================================
# SERVER
# =========================================
server.port=${PORT:8080}

server.error.include-message=always
server.error.include-stacktrace=never

server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# =========================================
# ACTUATOR
# =========================================
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true

# Disable mail health check to avoid Render warnings
management.health.mail.enabled=false

# =========================================
# LOGGING
# =========================================
logging.level.root=INFO
logging.level.com.atg.autonexo.backend=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

logging.file.max-size=10MB
logging.file.max-history=30

# =========================================
# EMAIL CONFIGURATION
# =========================================
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}

spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# =========================================
# APPLICATION EMAIL SETTINGS
# =========================================
autonexo.email.from=${EMAIL_FROM:noreply@autonexo.com}
autonexo.email.base-url=${APP_BASE_URL:https://autonexo.com}

# =========================================
# JACKSON JSON
# =========================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

spring.mail.enabled=true
management.health.mail.enabled=false
