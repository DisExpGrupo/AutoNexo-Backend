#PRODUCTION ENVIRONMENT CONFIGURATION

# Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=true&requireSSL=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate Configuration

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration

authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.expiration.days=${JWT_EXPIRATION_DAYS:7}

# Flyway Configuration

spring.flyway.enabled=${FLYWAY_ENABLED:false}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.base-url=${CLOUDINARY_BASE_URL:autonexo}

# Server Configuration

server.port=${PORT:8080}
server.error.include-message=always
server.error.include-stacktrace=never

# Actuator (security in production)
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health

# Email configuration (JavaMailSender)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Application email settings
autonexo.email.from=${EMAIL_FROM:noreply@autonexo.com}
autonexo.email.base-url=${APP_BASE_URL:https://autonexo.com}