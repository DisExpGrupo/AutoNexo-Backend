<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #f44336; color: white; padding: 20px; text-align: center; }
        .content { padding: 20px; background-color: #f9f9f9; }
        .footer { text-align: center; padding: 20px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Invitation Expired</h1>
        </div>
        <div class="content">
            <p>Hello,</p>
            <p>Your invitation to join <strong>{workshopName}</strong> on Autonexo has expired.</p>
            <p>If you would like to join this workshop, please contact the workshop manager to request a new invitation.</p>
        </div>
        <div class="footer">
            <p>This is an automated message from Autonexo. Please do not reply to this email.</p>
        </div>
    </div>
</body>
</html>
