# fly.toml app configuration file generated for backend-azure-overbrook-3913 on 2026-05-27T12:20:30-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'autonexo-backend-production-6767'
primary_region = 'iad'
kill_signal = "SIGTERM"
kill_timeout = "35s"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
  grace_period = "60s"
  interval = "15s"
  timeout = "10s"
  method = "GET"
  path = "/actuator/health"

[[vm]]
  cpus = 1
  memory = "768mb"

[env]
  SPRING_PROFILES_ACTIVE = "prod"
  JWT_EXPIRATION_DAYS = 7
  _JAVA_OPTIONS = "-Xms256m -Xmx512m"