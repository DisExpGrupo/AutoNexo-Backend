name: CI/CD - Pipeline Principal

on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch: # Mantiene el botón manual en la web

jobs:
  # ==========================================
  # TRABAJO 1: Verificación de Código (Tests)
  # ==========================================
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Execute Tests
        run: ./mvnw test

  # ==========================================
  # TRABAJO 2: Despliegue en la Nube (Deploy)
  # ==========================================
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    concurrency: deploy-group
    
    needs: test 
    
    # 🌟 Simplificado: Si el evento es un push (Merge), va a main. Si es un PR, este job se ignora solo.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
