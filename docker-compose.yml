version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: autonexo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Admin-123
      MYSQL_DATABASE: autonexo-database
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  autonexo-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autonexo-backend
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: autonexo-database
      DB_USERNAME: root
      DB_PASSWORD: Admin-123
      
      JWT_SECRET: autonexo-dev-secret-jwt-key-for-development-only-2024
      JWT_EXPIRATION_DAYS: 7
      
      CLOUDINARY_CLOUD_NAME: dxbmcwti0
      CLOUDINARY_API_KEY: 323226415791696
      CLOUDINARY_API_SECRET: DrkoIPMJ-BvsFNRG49DpbRRQVyw
      CLOUDINARY_BASE_URL: autonexo
      
      FLYWAY_ENABLED: false
      PORT: 8080
      JAVA_OPTS: "-Xmx512m -Xms256m"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  mysql_data: